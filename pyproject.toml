[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestion-source"
version = "0.1.0"
description = "LegalTrace Indian Kanoon Data Acquisition & Ingestion Module"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LegalTrace Team", email = "research@legaltrace.org" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "numpy>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    # Phase 2: Database Infrastructure
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "falkordb>=1.0.8",
    # Phase 1: RAG & LLM (Groq)
    "groq>=0.11.0",
    # Phase 4: Advanced Legal AI (Transformer Embeddings)
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
ingest = "ingestion_source.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers -p no:anyio"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asynchronous coroutine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_source"]
